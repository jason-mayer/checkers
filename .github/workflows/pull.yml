name: build check

on: [pull_request]

jobs:
  build:
    name: compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2.7.0
      - uses: actions/setup-node@v2.5.2
        with:
          node-version: 26
      - run: npm ci --include=dev # install
      - run: npm run build
